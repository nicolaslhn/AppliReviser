<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cours & Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#16263b;--paper:#f3f6f9;--card:#fff;--line:#d9e1ea;--teal:#1f7a8c;--star:#f0a81c;--ok:#23925f;--okbg:#e3f5ec;--ko:#c93d54;--kobg:#fbe8eb;--muted:#5b6b7d}
@media(prefers-color-scheme:dark){:root{--ink:#e8eef5;--paper:#0f1a27;--card:#172536;--line:#2a3b50;--teal:#4cb5c8;--okbg:#12382a;--kobg:#401b24;--muted:#9bacbf}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Bricolage Grotesque",system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 20px;background:var(--ink);color:#fff}
header h1{margin:0;font-size:1.15rem;font-weight:800;cursor:pointer}
#back{background:transparent;color:#cfdae6;border:1px solid #3b4f66;border-radius:999px;padding:7px 16px;font:600 .95rem inherit;font-family:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--star);outline-offset:2px}
main{max-width:860px;margin:0 auto;padding:22px 16px 60px}
.hidden{display:none}
select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);max-width:100%}
h2.page{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;gap:14px}
.grid.three{grid-template-columns:repeat(3,1fr)}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--teal);transform:translateY(-2px)}
.tile b{font-size:1.2rem}
.tile span{color:var(--muted);font-size:.92rem}
.tile .tag{color:var(--teal);font-weight:600}
.helpbox{margin-top:26px}
.helpbox>.theme{display:block;margin-bottom:8px;font-weight:600}
/* Cours */
.course{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 26px 22px;font-family:"Source Serif 4",Georgia,serif;line-height:1.7}
.course h2{font-family:"Bricolage Grotesque",sans-serif;font-size:1.5rem;margin:.9em 0 .1em}
.course .theme{color:var(--muted);font:.9rem "Bricolage Grotesque",sans-serif}
.course h3{font-family:"Bricolage Grotesque",sans-serif;color:var(--teal);margin:1.6em 0 .3em;font-size:1.2rem}
.course h4{font-family:"Bricolage Grotesque",sans-serif;margin:1.2em 0 .2em}
.schema{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0;padding:14px;border:2px dashed var(--line);border-radius:12px;font:600 .95rem "Bricolage Grotesque",sans-serif;text-align:center}
.schema span:first-child,.schema span:last-child{background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px}
/* Quiz */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:16px}
.bar label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:3px}
.stats{margin-left:auto;display:flex;gap:18px;font-weight:600}
.stats b{font-size:1.25rem;color:var(--teal)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.qmeta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.9rem;margin-bottom:10px}
.stars{color:var(--star);letter-spacing:2px;font-size:1.25rem}.stars i{color:var(--line);font-style:normal}
.enonce{font-size:1.3rem;font-weight:600;margin:0 0 18px}
.choix{display:grid;gap:10px}
.choix button{text-align:left;font:inherit;color:inherit;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:13px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.choix button:hover:not(:disabled){border-color:var(--teal)}
.choix button.good{background:var(--okbg);border-color:var(--ok)}
.choix button.bad{background:var(--kobg);border-color:var(--ko)}
.choix button:disabled{cursor:default}
.explic{margin-top:18px;padding:16px;border-left:5px solid var(--ko);background:var(--kobg);border-radius:0 12px 12px 0}
.explic p{margin:4px 0 12px}
.next{background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:10px 20px;font:600 1rem inherit;font-family:inherit;cursor:pointer}
.ok-msg{margin-top:14px;color:var(--ok);font-weight:600}
.msg{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:700px){.grid.three{grid-template-columns:1fr}}
@media(max-width:560px){.stats{margin-left:0;width:100%}.course{padding:4px 16px 18px}.schema{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1 id="home-link">Cours & Quiz</h1>
  <button id="back" class="hidden">← Retour</button>
</header>
<main>
  <section id="v-home">
    <h2 class="page">Choisis un chapitre</h2>
    <p class="sub">Chaque chapitre propose le cours, un quiz guidé et un quiz seul.</p>
    <div class="grid" id="chapters"></div>
  </section>

  <section id="v-menu" class="hidden">
    <h2 class="page" id="menu-title"></h2>
    <p class="sub" id="menu-theme"></p>
    <div class="grid three">
      <button class="tile" id="go-cours"><b>Cours</b><span>Relire la synthèse du chapitre.</span></button>
      <button class="tile" id="go-aide"><b>Quiz avec le cours</b><span>Les questions s’enchaînent, avec le cours juste en dessous pour t’aider.</span></button>
      <button class="tile" id="go-quiz"><b>Quiz</b><span>Les questions seulement, pour te tester pour de vrai.</span></button>
    </div>
  </section>

  <section id="v-cours" class="hidden">
    <article class="course" id="course"></article>
  </section>

  <section id="v-quiz" class="hidden">
    <div class="bar">
      <label>Difficulté
        <select id="f-niv">
          <option value="0">Tous les niveaux</option>
          <option value="1">★ Facile</option>
          <option value="2">★★ Moyen</option>
          <option value="3">★★★ Difficile</option>
        </select>
      </label>
      <div class="stats"><span>Score <b id="s-score">0</b></span><span>Série <b id="s-streak">0</b></span><span>Réussite <b id="s-rate">–</b></span></div>
    </div>
    <div class="qcard" id="qcard" aria-live="polite"></div>
    <div class="helpbox hidden" id="helpbox"><span class="theme">Le cours pour t’aider</span><article class="course" id="help"></article></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const api = (p, opt) => fetch('api.php?' + p, opt).then(r => r.json());
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stars = n => '<span class="stars" aria-label="Niveau ' + n + ' sur 3">' + '★'.repeat(n) + '<i>' + '★'.repeat(3 - n) + '</i></span>';

let seen = [], score = 0, streak = 0, answered = 0, current = null, timer = null;

/* ---------- Navigation ---------- */
let chap = null, chapters = [], courseHTML = '', mode = 'quiz', view = 'home';
const views = ['home', 'menu', 'cours', 'quiz'];
function go(v) {
  view = v;
  views.forEach(x => $('#v-' + x).classList.toggle('hidden', x !== v));
  $('#back').classList.toggle('hidden', v === 'home');
  window.scrollTo(0, 0);
}
$('#back').onclick = () => go(view === 'menu' ? 'home' : 'menu');
$('#home-link').onclick = () => go('home');

async function openChapter(id) {
  chap = chapters.find(c => c.id == id);
  $('#menu-title').textContent = 'Chapitre ' + chap.numero + ' : ' + chap.titre;
  $('#menu-theme').textContent = chap.theme + ' · ' + chap.nb_questions + ' questions';
  const c = await api('action=cours&id=' + id);
  courseHTML = c.erreur ? '<p class="msg">' + esc(c.erreur) + '</p>'
    : '<h2>Chapitre ' + c.numero + ' : ' + esc(c.titre) + '</h2><div class="theme">' + esc(c.theme) + '</div>' + c.contenu;
  go('menu');
}
$('#go-cours').onclick = () => { $('#course').innerHTML = courseHTML; go('cours'); };
$('#go-aide').onclick = () => startQuiz('aide');
$('#go-quiz').onclick = () => startQuiz('quiz');

function startQuiz(m) {
  mode = m;
  $('#helpbox').classList.toggle('hidden', m !== 'aide');
  if (m === 'aide') $('#help').innerHTML = courseHTML;
  score = streak = answered = 0;
  $('#s-score').textContent = 0; $('#s-streak').textContent = 0; $('#s-rate').textContent = '–';
  go('quiz');
  resetSession();
}

/* ---------- Quiz (défilement infini) ---------- */
function resetSession() { seen = []; current = null; clearTimeout(timer); nextQuestion(); }
$('#f-niv').onchange = resetSession;

async function nextQuestion(retry) {
  clearTimeout(timer);
  const p = new URLSearchParams({ action: 'question', chapitre: chap.id, niveau: $('#f-niv').value, exclude: seen.join(',') });
  let q;
  try { q = await api(p.toString()); } catch (e) { q = { erreur: 'Impossible de joindre le serveur.' }; }
  if (q.erreur) { $('#qcard').innerHTML = '<p class="msg">' + esc(q.erreur) + '</p>'; return; }
  if (q.vide) {                       // toutes les questions ont été vues : on repart de zéro
    if (retry || !seen.length) { $('#qcard').innerHTML = '<p class="msg">Aucune question pour cette sélection.</p>'; return; }
    seen = []; return nextQuestion(true);
  }
  current = q; seen.push(q.id);
  $('#qcard').innerHTML =
    '<div class="qmeta"><span>' + esc(q.chapitre) + '</span>' + stars(+q.niveau) + '</div>' +
    '<p class="enonce">' + esc(q.enonce) + '</p>' +
    '<div class="choix">' + q.reponses.map(r => '<button data-id="' + r.id + '">' + esc(r.texte) + '</button>').join('') + '</div>' +
    '<div id="feedback"></div>';
  document.querySelectorAll('.choix button').forEach(b => b.onclick = () => answer(b));
  $('.choix button').focus({ preventScroll: true });
}

async function answer(btn) {
  const buttons = [...document.querySelectorAll('.choix button')];
  buttons.forEach(b => b.disabled = true);
  const fd = new FormData();
  fd.append('action', 'repondre'); fd.append('question_id', current.id); fd.append('reponse_id', btn.dataset.id);
  const r = await api('', { method: 'POST', body: fd });
  answered++;
  buttons.find(b => +b.dataset.id === r.bonne_id).classList.add('good');
  if (r.correct) {
    score++; streak++;
    $('#feedback').innerHTML = '<p class="ok-msg">Bonne réponse !</p>';
    timer = setTimeout(nextQuestion, 900);                 // on passe à la suivante automatiquement
  } else {
    streak = 0; btn.classList.add('bad');
    $('#feedback').innerHTML = '<div class="explic"><b>Pas tout à fait.</b><p>' + esc(r.explication) + '</p><button class="next" id="next">Question suivante</button></div>';
    $('#next').onclick = () => nextQuestion(); $('#next').focus();
  }
  $('#s-score').textContent = score; $('#s-streak').textContent = streak;
  $('#s-rate').textContent = Math.round(score / answered * 100) + ' %';
}

/* ---------- Initialisation ---------- */
(async () => {
  try {
    chapters = await api('action=chapitres');
    if (chapters.erreur) throw new Error(chapters.erreur);
    $('#chapters').innerHTML = chapters.map(c =>
      '<button class="tile" data-id="' + c.id + '"><span class="tag">Chapitre ' + c.numero + '</span><b>' + esc(c.titre) + '</b><span>' + esc(c.theme) + ' · ' + c.nb_questions + ' questions</span></button>').join('');
    document.querySelectorAll('#chapters .tile').forEach(b => b.onclick = () => openChapter(b.dataset.id));
  } catch (e) {
    $('#chapters').innerHTML = '<p class="msg">' + esc(e.message || 'Erreur') + '</p>';
  }
})();
</script>
</body>
</html>
